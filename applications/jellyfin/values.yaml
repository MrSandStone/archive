replicaCount: 1

image:
  pullPolicy: IfNotPresent

persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: ''
  media:
    enabled: true
    size: 100Gi
    storageClass: ''

service:
  type: ClusterIP
  port: 8096

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

timezone: Europe/Warsaw

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jellyfin.example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

hardwareAcceleration:
  intelQuickSync:
    enabled: true
    devicePath: /dev/dri
    supplementalGroups:
      - 44
      - 991

volumeMounts:
  - name: dev-dri
    mountPath: /dev/dri

volumes:
  - name: dev-dri
    hostPath:
      path: /dev/dri
      type: Directory

nodeSelector: {}
tolerations: []
affinity: {}
